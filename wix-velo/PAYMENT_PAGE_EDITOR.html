<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>עריכת מלל — דף תשלום</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style id="page-css"></style>
  <style>
    html, body { margin: 0; background: #fff7f8; }
    .editor-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid rgba(201, 44, 89, 0.16);
      font-family: "Assistant", Arial, sans-serif;
    }
    .editor-bar label { font-size: 0.92rem; font-weight: 700; color: #2B2430; }
    .editor-bar select, .name-edit {
      font-family: inherit;
      font-size: 0.95rem;
      border: 1px solid rgba(201, 44, 89, 0.25);
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      color: #2B2430;
    }
    .editor-bar select { min-width: min(100%, 280px); font-weight: 700; }
    .name-edit { width: 88px; font-weight: 700; text-align: center; }
    .save-btn {
      margin-inline-start: auto;
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(180deg, #d43262 0%, #C92C59 100%);
    }
    .toast { font-size: 0.88rem; font-weight: 700; color: #1f6b47; }
    .hint {
      margin: 0;
      padding: 8px 14px 0;
      font-family: "Assistant", Arial, sans-serif;
      color: #7C7382;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .token {
      display: inline-block;
      margin: 0 2px;
      padding: 0 6px;
      border-radius: 999px;
      background: rgba(238, 63, 110, 0.1);
      color: #C92C59;
      font-weight: 800;
    }
    .editor-caption {
      margin: 14px 0 0;
      text-align: center;
      font-family: "Assistant", Arial, sans-serif;
      color: #7C7382;
      font-size: 0.85rem;
    }
    #stage { position: relative; display: block; min-height: calc(100vh - 96px); padding: 12px; }
    #stage #loadingScreen { position: absolute; z-index: 2; }
    #stage .redirect-overlay.editor-inline {
      position: relative;
      inset: auto;
      display: flex;
      min-height: 220px;
      margin-top: 4px;
    }
    #stage [contenteditable="true"] { cursor: text; }
    #stage [contenteditable="true"]:hover { outline: 2px dashed rgba(238, 63, 110, 0.55); outline-offset: 3px; }
    #stage [contenteditable="true"]:focus:not(.cta-button) { outline: 2px solid #EE3F6E; outline-offset: 3px; background: rgba(255, 255, 255, 0.72); }
    #stage .cta-button:focus { outline: 2px solid #fff; outline-offset: -6px; }
    #stage .cta-button:focus {
      background: #C92C59 !important;
      color: #fff !important;
      caret-color: #fff;
    }
    #stage .cta-button.is-placeholder {
      background: transparent;
      color: #C92C59;
      border: 2px dashed rgba(201, 44, 89, 0.45);
      box-shadow: none;
      animation: none;
    }
    #copy-hint {
      display: none;
      position: fixed;
      bottom: 160px;
      left: 12px;
      z-index: 80;
      padding: 8px 12px;
      border-radius: 10px;
      background: #C92C59;
      color: #fff;
      font-family: "Assistant", Arial, sans-serif;
      font-weight: 700;
    }
    #manual-copy {
      display: none;
      box-sizing: border-box;
      width: calc(100% - 24px);
      height: 140px;
      margin: 0;
      padding: 10px;
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 80;
      background: #fff;
      border: 2px solid #C92C59;
      border-radius: 12px;
      font-family: Consolas, monospace;
      font-size: 12px;
      direction: ltr;
    }
  </style>
</head>
<body>
  <div class="editor-bar">
    <label for="scene">מצב</label>
    <select id="scene"></select>
    <label for="fallbackName">שם אם חסר</label>
    <input id="fallbackName" class="name-edit" />
    <button type="button" class="save-btn" id="save">העתקת JSON</button>
    <span class="toast" id="toast"></span>
  </div>
  <p class="hint">לחצי על כל טקסט ועריכי אותו. בזמן העריכה מופיעים סימונים: <span class="token">{שם}</span> <span class="token">{שם_פרטי}</span> <span class="token">{מקדמה}</span> <span class="token">{סהכ}</span> <span class="token">{שולם}</span> <span class="token">{נותר}</span> <span class="token">{תאריך}</span>. אם לא שולם כלום הסוגריים יורדים, ואם אין תאריך היעד המשפט «עד {תאריך}» יורד.</p>
  <div id="stage"></div>
  <div id="copy-hint">ה-JSON מסומן. לחצי Ctrl+C כדי להעתיק.</div>
  <textarea id="manual-copy"></textarea>
  <textarea id="source" hidden><!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk With Kids Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #EE3F6E;
      --pink-dark: #C92C59;
      --blue-soft: #9BB6C1;
      --blue-bg: #EDF4F6;
      --white: #FFFFFF;
      --text: #2B2430;
      --muted: #7C7382;
      --line: rgba(201, 44, 89, 0.12);
      --shadow: 0 24px 60px rgba(78, 44, 62, 0.12);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Assistant", Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(238, 63, 110, 0.14), transparent 32%),
        radial-gradient(circle at bottom left, rgba(155, 182, 193, 0.22), transparent 28%),
        linear-gradient(180deg, #fffafb 0%, #f9fcfd 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 18px;
    }

    .app-shell {
      width: 100%;
      max-width: 1080px;
      min-height: calc(100vh - 36px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* שגיאת הזמנה: תוכן בראש המסך */
    .app-shell.app-shell--error {
      align-items: flex-start;
      justify-content: flex-start;
      padding-top: 10px;
    }

    .app-shell.app-shell--error #errorScreen {
      width: 100%;
    }

    .screen {
      width: 100%;
      display: none;
    }

    .screen.is-visible {
      display: block;
    }

    /* Loading screen should appear at top of viewport */
    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 18px;
      padding-top: 22px;
      background:
        radial-gradient(circle at top right, rgba(238, 63, 110, 0.14), transparent 32%),
        radial-gradient(circle at bottom left, rgba(155, 182, 193, 0.22), transparent 28%),
        linear-gradient(180deg, #fffafb 0%, #f9fcfd 100%);
    }

    #loadingScreen.is-visible {
      display: flex;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 7px;
      background: linear-gradient(90deg, var(--blue-soft), var(--pink));
    }

    .loader-card,
    .error-card {
      max-width: 640px;
      margin: 0 auto;
      padding: 42px 28px;
      text-align: center;
    }

    .loader-ring {
      width: 86px;
      height: 86px;
      margin: 0 auto 22px;
      border-radius: 50%;
      border: 6px solid rgba(238, 63, 110, 0.14);
      border-top-color: var(--pink);
      border-left-color: var(--blue-soft);
      animation: spin 1.15s linear infinite;
    }

    .loader-title,
    .error-title {
      margin: 0 0 10px;
      font-size: 2rem;
      line-height: 1.2;
      font-weight: 700;
      color: var(--pink-dark);
    }

    .loader-text,
    .error-text {
      margin: 0 auto;
      max-width: 420px;
      font-size: 1rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .progress-track {
      width: min(320px, 100%);
      height: 10px;
      margin: 28px auto 0;
      border-radius: 999px;
      background: rgba(155, 182, 193, 0.24);
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--blue-soft));
      animation: loadBar 4.5s ease forwards;
    }

    .order-layout {
      display: grid;
      grid-template-columns: minmax(280px, 1.05fr) minmax(280px, 0.95fr);
      gap: 24px;
      align-items: stretch;
      padding: 28px;
    }

    .hero-panel,
    .details-panel {
      padding: 28px;
      border-radius: 24px;
    }

    .hero-panel {
      background: var(--white);
      border: 1px solid var(--line);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
      box-shadow: 0 1px 0 rgba(201, 44, 89, 0.06);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(238, 63, 110, 0.1);
      border: 1px solid rgba(238, 63, 110, 0.18);
      color: var(--pink-dark);
      font-size: 0.9rem;
      letter-spacing: 0.01em;
      font-weight: 700;
    }

    .hero-title {
      margin: 18px 0 14px;
      font-size: 2.15rem;
      line-height: 1.25;
      font-weight: 700;
      color: var(--pink-dark);
    }

    .hero-subtitle {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.95;
      color: var(--text);
      max-width: 520px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      margin-top: 22px;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.96rem;
      font-weight: 700;
      background: rgba(238, 63, 110, 0.1);
      color: var(--pink-dark);
      border: 1px solid rgba(238, 63, 110, 0.22);
    }

    .status-chip.waiting {
      background: rgba(238, 63, 110, 0.1);
      color: var(--pink-dark);
      border-color: rgba(238, 63, 110, 0.22);
    }

    .status-chip.info {
      background: rgba(155, 182, 193, 0.2);
      color: #4a6570;
      border-color: rgba(155, 182, 193, 0.45);
    }

    .status-chip.success {
      background: rgba(92, 183, 136, 0.18);
      color: #1f6b47;
      border-color: rgba(92, 183, 136, 0.4);
    }

    .status-chip.danger {
      background: rgba(201, 44, 89, 0.12);
      color: #7a1538;
      border-color: rgba(201, 44, 89, 0.28);
    }

    .cta-button {
      margin-top: 26px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 1.06rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      color: var(--white);
      background: linear-gradient(180deg, #d43262 0%, var(--pink-dark) 100%);
      box-shadow: 0 14px 32px rgba(201, 44, 89, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      animation: pulse 1.8s ease-in-out infinite;
      overflow: hidden;
      position: relative;
    }

    .cta-button::after {
      content: "";
      position: absolute;
      top: -20%;
      right: -140%;
      width: 42%;
      height: 140%;
      transform: rotate(22deg);
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.08) 15%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0.08) 85%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
      animation: buttonShine 4.8s ease-in-out infinite;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(201, 44, 89, 0.42);
    }

    .cta-button:active {
      transform: translateY(0);
    }

    .cta-button[disabled] {
      cursor: not-allowed;
      opacity: 0.55;
      box-shadow: none;
      animation: none;
    }

    .hero-price-row {
      margin-top: 14px;
      width: 100%;
      text-align: center;
    }

    .hero-price-single-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .hero-price-label-inline {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
    }

    .hero-price-coupon-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .hero-price-three-wrap {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .hero-price-three-line {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .hero-price-three-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      min-width: 100px;
      text-align: left;
    }

    .price-three-original {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      font-variant-numeric: tabular-nums;
    }

    .price-three-paid {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1f6b47;
      font-variant-numeric: tabular-nums;
    }

    .hero-price-three-divider {
      width: 80%;
      max-width: 220px;
      height: 1px;
      background: rgba(155, 182, 193, 0.3);
      margin: 1px auto;
    }

    .hero-price-coupon-line {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    .hero-price-mini-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }

    .price-strikethrough {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(124, 115, 130, 0.45);
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .price-final {
      font-size: 1.22rem;
      font-weight: 800;
      color: var(--pink-dark);
      font-variant-numeric: tabular-nums;
    }

    .hero-price-single-wrap .price-final {
      font-size: 1.28rem;
    }

    .details-panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(237, 244, 246, 0.88));
      border: 1px solid var(--line);
    }

    .panel-title {
      margin: 0 0 20px;
      font-size: 1.32rem;
      font-weight: 700;
      color: var(--pink-dark);
    }

    .detail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .detail-item {
      padding: 16px 16px 14px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(155, 182, 193, 0.28);
      border-radius: 18px;
    }

    .detail-item.full {
      grid-column: 1 / -1;
    }

    .order-details-accordion {
      border: 1px solid rgba(155, 182, 193, 0.28);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.82);
      overflow: hidden;
    }

    .order-details-accordion summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      font-size: 1.03rem;
      font-weight: 700;
      color: var(--pink-dark);
      user-select: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(237, 244, 246, 0.58));
    }

    .order-details-accordion summary::-webkit-details-marker {
      display: none;
    }

    .order-details-accordion summary::after {
      content: "⌄";
      font-size: 1.1rem;
      color: var(--pink-dark);
      transition: transform 0.22s ease;
    }

    .order-details-accordion[open] summary::after {
      transform: rotate(180deg);
    }

    .order-details-content {
      padding: 12px;
      border-top: 1px solid rgba(155, 182, 193, 0.22);
      background: rgba(255, 255, 255, 0.72);
    }

    .products-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(155, 182, 193, 0.22);
    }

    .products-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px;
      align-items: center;
      padding: 14px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(155, 182, 193, 0.28);
      border-radius: 18px;
    }

    .product-card--no-image {
      grid-template-columns: 1fr;
    }

    .product-image-wrap {
      width: 88px;
      height: 88px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, #fff3f7, #eef5f7);
      border: 1px solid rgba(238, 63, 110, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-image-placeholder {
      color: var(--pink-dark);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
      padding: 10px;
    }

    .product-main {
      min-width: 0;
    }

    .product-name {
      margin: 0 0 10px;
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 700;
      color: var(--text);
    }

    .product-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .product-meta-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--blue-bg);
    }

    .product-meta-label {
      margin: 0 0 5px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .product-meta-value {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .product-price-old {
      margin-inline-end: 6px;
      color: var(--muted);
      font-weight: 600;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .detail-label {
      margin: 0 0 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .detail-value {
      margin: 0;
      font-size: 1.06rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text);
      word-break: break-word;
    }

    .support-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      color: var(--white);
      background: linear-gradient(90deg, var(--pink), var(--pink-dark));
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .support-link:hover {
      transform: translateY(-1px);
      opacity: 0.94;
    }

    .support-note {
      margin: 16px 0 0;
      font-size: 0.98rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .redirect-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(255, 250, 252, 0.84);
      backdrop-filter: blur(6px);
    }

    .redirect-overlay.is-visible {
      display: flex;
    }

    .redirect-card {
      width: min(100%, 420px);
      padding: 28px 24px;
      text-align: center;
    }

    .redirect-ring {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 5px solid rgba(238, 63, 110, 0.14);
      border-top-color: var(--pink);
      border-left-color: var(--blue-soft);
      animation: spin 0.9s linear infinite;
    }

    .redirect-title {
      margin: 0 0 8px;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--pink-dark);
    }

    .redirect-text {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.8;
      color: var(--muted);
    }

          if (labelValues[index]) el.textContent = labelValues[index];
        });
        if (mini[0]) mini[0].textContent = PAGE_COPY.priceBefore;
        if (mini[1]) mini[1].textContent = PAGE_COPY.priceAfter;
        if (three[0]) three[0].textContent = PAGE_COPY.priceFull;
        if (three[1]) three[1].textContent = PAGE_COPY.pricePaid;
        if (heroPriceSingleLabel) heroPriceSingleLabel.textContent = PAGE_COPY.priceToPay;
        setRemainingPriceLabel(PAGE_COPY.priceRemaining);
      }

      function showScreen(target) {
        [loadingScreen, orderScreen, errorScreen].forEach(function (node) {
          node.classList.remove("is-visible");
        });
        target.classList.add("is-visible");
        if (appShell) {
          appShell.classList.toggle("app-shell--error", target === errorScreen);
        }
      }

      function setStruckPrice(node, payAmount, fullAmount) {
        var pay = Number(payAmount) || 0;
        var full = Number(fullAmount);
        node.textContent = "";
        if (Number.isFinite(full) && full > pay + 0.009) {
          var oldPrice = document.createElement("span");
          oldPrice.className = "product-price-old";
          oldPrice.textContent = withSpace(PAGE_COPY.beforeDiscount) + formatPrice(full);
          node.appendChild(oldPrice);
          node.appendChild(document.createTextNode(withSpace(PAGE_COPY.afterDiscount) + formatPrice(pay)));
          return;
        }
        node.appendChild(document.createTextNode(formatPrice(pay)));
      }

      function formatPrice(value) {
        return new Intl.NumberFormat("he-IL", {
          style: "currency",
          currency: "ILS",
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }).format(Number(value || 0));
      }

      function formatDate(dateValue) {
        if (!dateValue) return PAGE_COPY.notAvailable;
        var parsed = new Date(dateValue);
        if (Number.isNaN(parsed.getTime())) return PAGE_COPY.notAvailable;
        return new Intl.DateTimeFormat("he-IL", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }).format(parsed);
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function shouldShowHeroPrice(order) {
        if (order.showHeroPrice === false) return false;
        if (order.showHeroPrice === true) return true;
        var s = order.status || "";
        return s !== "paid_completed" && s !== "paid";
      }

      function setRemainingPriceLabel(text) {
        var label = document.getElementById("heroPriceThreeRemainingLabel");
        if (label) label.textContent = text;
      }

      function renderHeroPrice(order) {
        if (!shouldShowHeroPrice(order)) {
          heroPriceRow.style.display = "none";
          return;
        }
        if (order.detailsOnly) {
          var fullPrice = Number(order.originalPrice != null ? order.originalPrice : order.totalPrice) || 0;
          var paidOutside = Number(order.actualPaidAmount) || Number(order.depositPaidAmount) || Number(order.depositAmount) || 0;
          var laterBalance = Math.max(0, fullPrice - paidOutside);
          heroPriceRow.style.display = "block";
          heroPriceCouponWrap.style.display = "none";
          heroPriceSingleWrap.style.display = "none";
          heroPriceThreeWrap.style.display = "flex";
          heroPriceThreeOriginal.textContent = formatPrice(fullPrice);
          heroPriceThreePaid.textContent = formatPrice(paidOutside);
          heroPriceThreeRemaining.textContent = formatPrice(laterBalance);
          setRemainingPriceLabel(PAGE_COPY.priceLater);
          return;
        }
        setRemainingPriceLabel(PAGE_COPY.priceRemaining);
        var pay = order.payPrice != null ? order.payPrice : order.totalPrice;
        var orig = order.originalPrice != null ? order.originalPrice : order.totalPrice;
        var actualPaid = Number(order.actualPaidAmount) || 0;
        // תצוגת שלוש-שורות:
        //   1. partial_paid — שולם חלק, קיימת יתרה לתשלום
        //   2. auto_paid (isAlreadyPaid) — תמיד: סה"כ הזמנה / שולם בפועל / יתרה
        var showThreeWay = (actualPaid > 0 && Number(pay) > 0.009 && Math.abs(Number(orig) - actualPaid) > 0.009)
                        || (order.isAlreadyPaid && actualPaid > 0);
        var showCompare = !showThreeWay && !order.isAlreadyPaid && (
          order.showCouponPriceCompare === true ||
          (order.hasCoupon && Math.abs(Number(orig) - Number(pay)) > 0.009)
        );
        heroPriceRow.style.display = "block";
        if (showThreeWay) {
          heroPriceCouponWrap.style.display = "none";
          heroPriceSingleWrap.style.display = "none";
          heroPriceThreeWrap.style.display = "flex";
          heroPriceThreeOriginal.textContent = formatPrice(orig);
          // עבור auto_paid: actualPaid הוא השולם; עבור partial_paid: actualPaid < orig
          heroPriceThreePaid.textContent = formatPrice(actualPaid);
          // יתרה — עבור auto_paid שולם הכל: payPrice=0; עבור partial_paid: payPrice=remaining
          heroPriceThreeRemaining.textContent = formatPrice(Number(pay));
        } else if (showCompare) {
          heroPriceCouponWrap.style.display = "flex";
          heroPriceSingleWrap.style.display = "none";
          heroPriceThreeWrap.style.display = "none";
          heroPriceOriginal.textContent = formatPrice(orig);
          heroPricePay.textContent = formatPrice(pay);
        } else {
          heroPriceCouponWrap.style.display = "none";
          heroPriceSingleWrap.style.display = "flex";
          heroPriceThreeWrap.style.display = "none";
          heroPriceSingleLabel.textContent = PAGE_COPY.priceToPay;
          heroPriceSingle.textContent = formatPrice(pay);
        }
      }

      function renderProducts(products) {
        var list = Array.isArray(products) ? products : [];
        productsList.innerHTML = "";

        if (!list.length) {
          productsList.innerHTML = '<div class="detail-item full"><p class="detail-value">' + escapeHtml(PAGE_COPY.noProducts) + '</p></div>';
          return;
        }

        list.forEach(function (product) {
          var card = document.createElement("article");
          card.className = product.image ? "product-card" : "product-card product-card--no-image";

          var imageWrap = null;
          if (product.image) {
            imageWrap = document.createElement("div");
            imageWrap.className = "product-image-wrap";
            var image = document.createElement("img");
            image.className = "product-image";
            image.src = product.image;
            image.alt = product.name || PAGE_COPY.productFallback;
            image.loading = "lazy";
            image.referrerPolicy = "no-referrer";
            imageWrap.appendChild(image);
          }

          var main = document.createElement("div");
          main.className = "product-main";
          main.innerHTML =
            '<h4 class="product-name"></h4>' +
            '<div class="product-meta">' +
              '<div class="product-meta-item">' +
                '<p class="product-meta-label">' + escapeHtml(PAGE_COPY.labelQty) + '</p>' +
                '<p class="product-meta-value"></p>' +
              '</div>' +
              '<div class="product-meta-item">' +
                '<p class="product-meta-label">' + escapeHtml(PAGE_COPY.labelUnit) + '</p>' +
                '<p class="product-meta-value"></p>' +
              '</div>' +
              '<div class="product-meta-item">' +
                '<p class="product-meta-label">' + escapeHtml(PAGE_COPY.labelLine) + '</p>' +
                '<p class="product-meta-value"></p>' +
              '</div>' +
            '</div>';

          var nameNode = main.querySelector(".product-name");
          var valueNodes = main.querySelectorAll(".product-meta-value");
          nameNode.textContent = product.name || PAGE_COPY.productFallback;
          valueNodes[0].textContent = String(product.quantity || 1);
          setStruckPrice(valueNodes[1], product.unitPrice, product.originalUnitPrice);
          setStruckPrice(valueNodes[2], product.lineTotal, product.originalLineTotal);

          if (imageWrap) card.appendChild(imageWrap);
          card.appendChild(main);
          productsList.appendChild(card);
        });
      }

      function showRedirectOverlay() {
        var scene = currentOrder ? sceneCopyOf(currentOrder) : {};
        var text = fillCopy(scene.redirectText || "", currentOrder || {});
        var redirectTitle = document.querySelector(".redirect-title");
        if (redirectTitle) redirectTitle.textContent = PAGE_COPY.redirectTitle;
        if (!String(text || "").trim()) {
          redirectSubtext.style.display = "none";
        } else {
          redirectSubtext.textContent = text;
          redirectSubtext.style.display = "";
        }
        redirectOverlay.classList.add("is-visible");
        redirectOverlay.setAttribute("aria-hidden", "false");
      }

      function startCheckoutRedirect() {
        if (isRedirecting) return;
        isRedirecting = true;
        console.log("[TWK-IFRAME] requesting checkout creation from parent");
        showRedirectOverlay();
        payButton.setAttribute("aria-disabled", "true");
        payButton.style.pointerEvents = "none";

        window.parent.postMessage({
          type: MESSAGE_TYPE,
          action: "REQUEST_CHECKOUT",
          payload: {}
        }, "*");
      }

      function renderOrder(order) {
        currentOrder = order;
        applyStaticCopy();
        console.log("[TWK-IFRAME] renderOrder payload:", order);
        var scene = sceneCopyOf(order);
        setText("heroTitle", fillCopy(PAGE_COPY.heroTitle, order));
        var heroSubtitle = document.querySelector(".hero-subtitle");
        if (heroSubtitle) heroSubtitle.textContent = fillCopy(scene.subtitle || "", order);
        setText("customerName", order.customerName || PAGE_COPY.notAvailable);
        setText("createdDate", formatDate(order.createdDate));
        setText("customerPhone", order.customerPhone || PAGE_COPY.notAvailable);
        var visibleStatus = fillCopy(scene.status || order.statusText || PAGE_COPY.statusFallback, order);
        setText("statusText", visibleStatus);

        var statusChip = document.getElementById("statusChip");
        statusChip.textContent = visibleStatus;
        statusChip.className = "status-chip " + (order.statusTone || "waiting");

        var couponRow = document.getElementById("couponRow");
        if (order.hasCoupon && order.couponDetailsText) {
          setText("couponDetails", order.couponDetailsText);
          couponRow.style.display = "block";
        } else {
          couponRow.style.display = "none";
        }

        var buttonLabel = fillCopy(scene.button || "", order).trim();
        if (buttonLabel) {
          payButton.textContent = buttonLabel;
          payButton.href = "#";
          payButton.style.display = "inline-flex";
          payButton.style.alignItems = "center";
          payButton.style.justifyContent = "center";
          payButton.removeAttribute("aria-disabled");
          payButton.style.pointerEvents = "auto";
          payButton.onclick = function (event) {
            event.preventDefault();
            console.log("[TWK-IFRAME] pay button clicked, requesting checkout");
            startCheckoutRedirect();
          };
        } else {
          payButton.style.display = "none";
          payButton.href = "#";
          payButton.setAttribute("aria-disabled", "true");
          payButton.style.pointerEvents = "none";
          payButton.onclick = null;
        }

        renderHeroPrice(order);

        renderProducts(order.products);

        showScreen(orderScreen);
      }

      function renderError(errorState) {
        var code = (errorState && errorState.code) || "";
        var message = code === "ORDER_LINK_EXPIRED" ? PAGE_COPY.expiredTitle : PAGE_COPY.errorTitle;
        if (errorState && (errorState.code || errorState.debug)) {
          console.error("[TWK-IFRAME] order error details:", {
            code: code || "UNKNOWN_ERROR",
            message: (errorState && errorState.message) || message,
            debug: errorState.debug || null
          });
        }
        errorTitle.textContent = message;
        errorText.textContent = PAGE_COPY.errorText;
        var support = document.querySelector(".support-link");
        if (support) {
          support.textContent = PAGE_COPY.errorSupport;
          if (PAGE_COPY.errorSupportUrl) support.href = PAGE_COPY.errorSupportUrl;
        }
        showScreen(errorScreen);
      }

      function maybeRender() {
        if (!state.minDelayDone) return;
        if (state.order) {
          renderOrder(state.order);
          return;
        }
        if (state.error) {
          renderError(state.error);
        }
      }

      window.addEventListener("message", function (event) {
        var data = event.data || {};
        console.log("[TWK-IFRAME] message received from parent:", data);
        if (data.type !== MESSAGE_TYPE) return;

        if (data.action === "ORDER_DATA") {
          state.order = data.payload || null;
          state.error = null;
          maybeRender();
          return;
        }

        if (data.action === "ORDER_ERROR") {
          state.error = data.payload || { message: PAGE_COPY.errorTitle };
          state.order = null;
          maybeRender();
          return;
        }

        if (data.action === "CHECKOUT_ERROR") {
          var errorMsg = PAGE_COPY.checkoutError || (data.payload && data.payload.message) || "";
          console.error("[TWK-IFRAME] checkout creation error:", data.payload);
          isRedirecting = false;
          redirectOverlay.classList.remove("is-visible");
          redirectOverlay.setAttribute("aria-hidden", "true");
          payButton.removeAttribute("aria-disabled");
          payButton.style.pointerEvents = "auto";
          alert(errorMsg);
        }
      });

      applyStaticCopy();

      window.parent.postMessage({
        type: MESSAGE_TYPE,
        action: "IFRAME_READY"
      }, "*");

      window.setTimeout(function () {
        state.minDelayDone = true;
        maybeRender();
      }, MIN_LOADING_MS);

      window.setTimeout(function () {
        if (!state.order && !state.error) {
          state.error = { message: PAGE_COPY.errorTitle };
          maybeRender();
        }
      }, FAILSAFE_MS);
    })();
  </script>
</body>
</html>

  <script>
    var UI = [
      { id: "loading", title: "מסך טעינה", kind: "loading" },
      { id: "unpaid", title: "תשלום רגיל", kind: "order", price: "single" },
      { id: "coupon", title: "תשלום רגיל עם קופון", kind: "order", copy: "unpaid", price: "compare" },
      { id: "zero", title: "סכום 0 ₪", kind: "order", price: "zero" },
      { id: "autoPaid", title: "שולם מראש", kind: "order", price: "three" },
      { id: "awaitingDeposit", title: "מקדמה לתשלום", kind: "order", price: "deposit" },
      { id: "depositPrepaid", title: "מקדמה שולמה מראש — השלמת פרטים", kind: "order", price: "later" },
      { id: "depositPaid", title: "מקדמה שולמה — נותרה יתרה", kind: "order", price: "three" },
      { id: "depositPrepaidWait", title: "מקדמה מראש — ממתינים לתאריך", kind: "order", price: "later" },
      { id: "depositPrepaidDue", title: "מקדמה מראש — הגיע מועד היתרה", kind: "order", price: "three" },
      { id: "partial", title: "שולם חלקית", kind: "order", price: "three" },
      { id: "paidPending", title: "שולם — נותר למלא פרטים", kind: "order", price: "single" },
      { id: "cancelled", title: "בוטלה / שגיאה", kind: "order", price: "single" },
      { id: "notFound", title: "הזמנה לא נמצאה", kind: "error", titleKey: "errorTitle" },
      { id: "expired", title: "קישור פג תוקף", kind: "error", titleKey: "expiredTitle" },
      { id: "checkoutError", title: "שגיאה ביצירת תשלום", kind: "error", titleKey: "checkoutError", solo: true }
    ];

    var template = document.getElementById("source").value;
    var startMark = "/*PAGE_COPY_START*/";
    var endMark = "/*PAGE_COPY_END*/";
    var copy = JSON.parse(template.slice(template.indexOf(startMark) + startMark.length, template.indexOf(endMark)));
    var styleMatch = template.match(/<style>([\s\S]*?)<\/style>/);
    var pageCss = styleMatch ? styleMatch[1] : "";
    pageCss = pageCss.replace(/html,\s*body\s*\{/g, "#stage {").replace(/\bbody\s*\{/g, "#stage {");
    document.getElementById("page-css").textContent = pageCss;

    var baseSample = {
      customerName: "נועה כהן",
      depositAmount: 350,
      originalPrice: 1200,
      totalPrice: 1200,
      depositPaidAmount: 100,
      actualPaidAmount: 100,
      balanceDueDate: "2026-12-01"
    };
    var currentSample = baseSample;
    var sceneSelect = document.getElementById("scene");
    var stage = document.getElementById("stage");
    var fallbackInput = document.getElementById("fallbackName");
    fallbackInput.value = copy.fallbackName || "";

    UI.forEach(function (item, index) {
      var option = document.createElement("option");
      option.value = String(index);
      option.textContent = item.title;
      sceneSelect.appendChild(option);
    });

    function formatPrice(value) {
      return new Intl.NumberFormat("he-IL", {
        style: "currency",
        currency: "ILS",
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(Number(value || 0));
    }

    function formatDate(value) {
      var parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return "";
      return new Intl.DateTimeFormat("he-IL", { day: "2-digit", month: "2-digit", year: "numeric" }).format(parsed);
    }

    function fillCopy(templateText, order) {
      var text = String(templateText || "");
      var name = String((order && order.customerName) || "").trim() || copy.fallbackName || "";
      var first = name.split(/\s+/)[0] || name;
      var deposit = Number(order && order.depositAmount) || 0;
      var total = Number(order && (order.originalPrice != null ? order.originalPrice : order.totalPrice)) || 0;
      var paid = Number(order && (order.depositPaidAmount || order.actualPaidAmount)) || 0;
      var due = order && order.balanceDueDate ? formatDate(order.balanceDueDate) : "";
      if (!(paid > 0)) {
        text = text.replace(/\s*\(\s*שולם עד כה \{שולם\}[,،]?\s*נותר לתשלום \{נותר\}\s*\)/g, "");
      }
      if (!due) text = text.replace(/\s*עד \{תאריך\}/g, "");
      return text
        .replace(/\{שם_פרטי\}/g, first)
        .replace(/\{שם\}/g, name)
        .replace(/\{מקדמה\}/g, formatPrice(deposit))
        .replace(/\{סהכ\}/g, formatPrice(total))
        .replace(/\{שולם\}/g, formatPrice(paid))
        .replace(/\{נותר\}/g, formatPrice(Math.max(0, deposit - (Number(order && order.depositPaidAmount) || 0))))
        .replace(/\{תאריך\}/g, due);
    }

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function field(tag, className, bind, raw) {
      var text = String(raw || "");
      var hasText = text.trim().length > 0;
      var shown = hasText ? fillCopy(text, currentSample) : "לחצי להוספת טקסט";
      return "<" + tag + ' class="' + className + (hasText ? "" : " is-placeholder") + '" contenteditable="true" spellcheck="false" data-bind="' + esc(bind) + '" data-raw="' + esc(text) + '">' + esc(shown) + "</" + tag + ">";
    }

    function writeBind(path, value) {
      var parts = path.split(".");
      if (parts[0] === "scenes") copy.scenes[parts[1]][parts[2]] = value;
      else copy[path] = value;
    }

    function sceneCopyKey(ui) {
      return ui.copy || ui.id;
    }

    function detail(labelBind, label, valueHtml, full) {
      return '<div class="detail-item' + (full ? " full" : "") + '"><p class="detail-label">' + field("span", "", labelBind, label) + '</p><p class="detail-value">' + valueHtml + "</p></div>";
    }

    function priceBlock(mode) {
      if (mode === "compare") {
        return '<div class="hero-price-row"><div class="hero-price-coupon-wrap" style="display:flex">'
          + '<div class="hero-price-coupon-line">' + field("span", "hero-price-mini-label", "priceBefore", copy.priceBefore) + '<span class="price-strikethrough">₪1,200</span></div>'
          + '<div class="hero-price-coupon-line">' + field("span", "hero-price-mini-label", "priceAfter", copy.priceAfter) + '<span class="price-final">₪1,080</span></div>'
          + "</div></div>";
      }
      if (mode === "three" || mode === "later") {
        var remainBind = mode === "later" ? "priceLater" : "priceRemaining";
        return '<div class="hero-price-row"><div class="hero-price-three-wrap" style="display:flex">'
          + '<div class="hero-price-three-line">' + field("span", "hero-price-three-label", "priceFull", copy.priceFull) + '<span class="price-three-original">₪1,200</span></div>'
          + '<div class="hero-price-three-line">' + field("span", "hero-price-three-label", "pricePaid", copy.pricePaid) + '<span class="price-three-paid">₪100</span></div>'
          + '<div class="hero-price-three-divider"></div>'
          + '<div class="hero-price-three-line">' + field("span", "hero-price-three-label", remainBind, copy[remainBind]) + '<span class="price-final">₪1,100</span></div>'
          + "</div></div>";
      }
      var amount = mode === "zero" ? "₪0" : mode === "deposit" ? "₪250" : "₪1,200";
      return '<div class="hero-price-row"><div class="hero-price-single-wrap" style="display:flex">'
        + field("span", "hero-price-label-inline", "priceToPay", copy.priceToPay)
        + '<span class="price-final">' + amount + "</span></div></div>";
    }

    function render() {
      var ui = UI[Number(sceneSelect.value)] || UI[1];
      currentSample = baseSample;
      var html = "";
      if (ui.kind === "loading") {
        html = '<div class="app-shell"><section class="screen is-visible" id="loadingScreen"><div class="card loader-card"><div class="loader-ring"></div>'
          + field("h1", "loader-title", "loadingTitle", copy.loadingTitle)
          + field("p", "loader-text", "loadingText", copy.loadingText)
          + '<div class="progress-track"><div class="progress-bar"></div></div></div></section></div>';
      } else if (ui.kind === "error") {
        html = '<div class="app-shell app-shell--error"><section class="screen is-visible"><div class="card error-card">'
          + field("h1", "error-title", ui.titleKey, copy[ui.titleKey]);
        if (!ui.solo) {
          html += field("p", "error-text", "errorText", copy.errorText)
            + field("a", "support-link", "errorSupport", copy.errorSupport)
            + '<p class="error-text">' + field("span", "", "errorSupportUrl", copy.errorSupportUrl) + "</p>";
        }
        html += "</div></section></div>";
      } else {
        var key = sceneCopyKey(ui);
        var scene = copy.scenes[key];
        html = '<div class="app-shell"><section class="screen is-visible"><div class="card order-layout"><div class="hero-panel"><div>'
          + field("h1", "hero-title", "heroTitle", copy.heroTitle)
          + field("p", "hero-subtitle", "scenes." + key + ".subtitle", scene.subtitle)
          + field("div", "status-chip waiting", "scenes." + key + ".status", scene.status)
          + "</div>"
          + field("div", "cta-button", "scenes." + key + ".button", scene.button)
          + priceBlock(ui.price)
          + '</div><div class="details-panel"><details class="order-details-accordion"><summary>'
          + field("span", "", "detailsSummary", copy.detailsSummary)
          + '</summary><div class="order-details-content"><div class="detail-list">'
          + detail("labelCustomer", copy.labelCustomer, esc("נועה כהן"))
          + detail("labelDate", copy.labelDate, esc("25/11/2026"))
          + detail("labelPhone", copy.labelPhone, esc("050-0000000"))
          + detail("labelCoupon", copy.labelCoupon, esc("קופון 10%"), true)
          + detail("labelStatus", copy.labelStatus, field("span", "", "scenes." + key + ".status", scene.status), true)
          + "</div></details>"
          + '<div class="products-section"><h3 class="panel-title">' + field("span", "", "productsTitle", copy.productsTitle) + "</h3>"
          + '<article class="product-card product-card--no-image"><div class="product-main"><h4 class="product-name">ערכת שיח</h4><div class="product-meta">'
          + '<div class="product-meta-item"><p class="product-meta-label">' + field("span", "", "labelQty", copy.labelQty) + '</p><p class="product-meta-value">1</p></div>'
          + '<div class="product-meta-item"><p class="product-meta-label">' + field("span", "", "labelUnit", copy.labelUnit) + '</p><p class="product-meta-value"><span class="product-price-old">' + field("span", "", "beforeDiscount", copy.beforeDiscount) + "₪100</span> " + field("span", "", "afterDiscount", copy.afterDiscount) + "₪80</p></div>"
          + '<div class="product-meta-item"><p class="product-meta-label">' + field("span", "", "labelLine", copy.labelLine) + '</p><p class="product-meta-value"><span class="product-price-old">' + field("span", "", "beforeDiscount", copy.beforeDiscount) + "₪100</span> " + field("span", "", "afterDiscount", copy.afterDiscount) + "₪80</p></div>"
          + "</div></div></article></div></div></div></section></div>"
          + '<p class="editor-caption">המסך שמופיע אחרי לחיצה על הכפתור</p>'
          + '<div class="redirect-overlay editor-inline is-visible"><div class="card redirect-card"><div class="redirect-ring"></div>'
          + field("h2", "redirect-title", "redirectTitle", copy.redirectTitle)
          + field("p", "redirect-text", "scenes." + key + ".redirectText", scene.redirectText)
          + "</div></div>";
      }
      stage.innerHTML = html;
      Array.prototype.forEach.call(stage.querySelectorAll("[data-bind]"), function (el) {
        var painting = false;
        function remember() {
          var raw = el.textContent.replace(/\u00a0/g, " ");
          if (!raw.trim()) raw = "";
          el.setAttribute("data-raw", raw);
          writeBind(el.getAttribute("data-bind"), raw);
          return raw;
        }
        el.addEventListener("focus", function () {
          painting = true;
          el.classList.remove("is-placeholder");
          el.textContent = el.getAttribute("data-raw") || "";
          painting = false;
        });
        el.addEventListener("input", function () {
          if (!painting) remember();
        });
        el.addEventListener("blur", function () {
          var raw = remember();
          var bind = el.getAttribute("data-bind");
          var hasText = raw.trim().length > 0;
          var shown = hasText ? fillCopy(raw, currentSample) : "לחצי להוספת טקסט";
          painting = true;
          Array.prototype.forEach.call(stage.querySelectorAll('[data-bind="' + bind + '"]'), function (node) {
            node.setAttribute("data-raw", raw);
            node.textContent = shown;
            node.classList.toggle("is-placeholder", !hasText);
          });
          painting = false;
        });
        el.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            el.blur();
          }
        });
      });
    }

    function commit() {
      var active = document.activeElement;
      if (active && active.getAttribute && active.getAttribute("data-bind")) {
        active.dispatchEvent(new Event("input"));
      }
      if (active && active !== document.body && active.blur) active.blur();
      copy.fallbackName = fallbackInput.value.trim() || "אהובה";
    }

    function selectCopyBox(text) {
      var box = document.getElementById("manual-copy");
      box.value = text;
      box.style.display = "block";
      box.focus();
      box.select();
      box.setSelectionRange(0, text.length);
      return box;
    }

    function copyText(text) {
      return new Promise(function (resolve, reject) {
        var copied = false;
        function onCopy(event) {
          if (!event.clipboardData) return;
          event.preventDefault();
          event.clipboardData.setData("text/plain", text);
          copied = true;
        }
        var box = selectCopyBox(text);
        box.style.opacity = "0";
        document.addEventListener("copy", onCopy, true);
        var commanded = false;
        try { commanded = document.execCommand("copy"); } catch (err) {}
        document.removeEventListener("copy", onCopy, true);
        if (copied || commanded) {
          box.style.display = "none";
          box.style.opacity = "1";
          document.getElementById("copy-hint").style.display = "none";
          resolve();
          return;
        }
        var write = navigator.clipboard && navigator.clipboard.writeText;
        function showFallback() {
          box.style.opacity = "1";
          document.getElementById("copy-hint").style.display = "block";
          box.focus();
          box.select();
          reject();
        }
        if (!write) {
          showFallback();
          return;
        }
        write.call(navigator.clipboard, text).then(function () {
          box.style.display = "none";
          box.style.opacity = "1";
          document.getElementById("copy-hint").style.display = "none";
          resolve();
        }, showFallback);
      });
    }

    sceneSelect.addEventListener("change", function () { commit(); render(); });
    fallbackInput.addEventListener("change", function () { commit(); render(); });
    document.getElementById("save").addEventListener("click", function () {
      commit();
      var toast = document.getElementById("toast");
      copyText(JSON.stringify(copy, null, 2)).then(function () {
        toast.textContent = "ה-JSON הועתק.";
      }).catch(function () {
        toast.textContent = "";
      });
    });

    render();
  </script>
</body>
</html>
